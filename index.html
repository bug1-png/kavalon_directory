<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>KAVALON Directory</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div id="app">

  <!-- ============ Attract / idle screen (full-bleed, own topbar/nav) ============ -->
  <div id="screen-home" class="screen active">
    <div class="attract" id="attract">
      <div id="attract-slides"></div>
      <div class="attract-scrim"></div>
      <div class="hud-corners">
        <span class="hud-corner tl"></span><span class="hud-corner tr"></span>
        <span class="hud-corner bl"></span><span class="hud-corner br"></span>
      </div>
      <div class="attract-content">
        <div class="attract-top">
          <img src="assets/brand/kavalon-logo-white.png" alt="KAVALON" />
          <div class="attract-building-badge">
            <span data-th="อาคาร" data-en="Building"></span>&nbsp;<span id="attract-building-id">A</span>
          </div>
          <div class="attract-clock" id="attract-clock"></div>
        </div>
        <div class="attract-middle">
          <div class="attract-title" data-th="Kavalon Directory" data-en="Kavalon Directory">Kavalon Directory</div>
          <div class="attract-subtitle" data-th="แผนที่โครงการ พื้นที่ส่วนกลาง และประกาศข่าวสารจากนิติบุคคล" data-en="Site map, common facilities, and announcements from the juristic office"></div>
        </div>
        <div class="attract-cta" id="attract-cta">
          <div class="tap-ring">
            <div class="tap-pulse">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5V6a2 2 0 0 1 4 0v5"></path><path d="M13 6a2 2 0 0 1 4 0v6"></path><path d="M17 8.5a2 2 0 0 1 4 0V14a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3.4l-2.8-4.7a1.8 1.8 0 0 1 3-2L9 13"></path></svg>
            </div>
          </div>
          <div class="attract-cta-label" data-th="แตะหน้าจอเพื่อเริ่มต้น" data-en="Tap the screen to begin"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ Main app chrome (topbar + nav), used by all other screens ============ -->
  <div class="topbar" id="topbar" style="display:none;">
    <img class="topbar-logo" id="topbar-logo" src="assets/brand/kavalon-logo-white.png" alt="KAVALON" />
    <div class="topbar-building">
      <div class="b-label" data-th="อาคารปัจจุบัน" data-en="Current building"></div>
      <div class="b-value" id="topbar-building-value">A</div>
    </div>
    <div class="topbar-right">
      <div class="clock">
        <div class="time" id="topbar-time">--:--</div>
        <div class="date" id="topbar-date">-</div>
      </div>
      <div class="lang-toggle">
        <button data-lang="th" id="lang-th">ไทย</button>
        <button data-lang="en" id="lang-en">EN</button>
      </div>
    </div>
  </div>

  <div id="screen-dashboard" class="screen">
    <div class="screen-pad" style="padding:0 0 40px;">
      <div class="home-hero" id="dashboard-hero">
        <div class="home-hero-text">
          <div class="h-eyebrow" data-th="กำลังใช้งานที่" data-en="You are viewing from"></div>
          <div class="h-title"><span data-th="อาคาร" data-en="Building"></span> <span id="dashboard-building">A</span></div>
        </div>
      </div>
      <div id="dashboard-pinned-banner"></div>
      <div class="quick-grid">
        <div class="quick-card grad-blue" data-goto="map">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="แผนที่โครงการ" data-en="Site Map"></div>
            <div class="desc" data-th="ดูตำแหน่งอาคารและโซนต่างๆ" data-en="Explore buildings and zones"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-purple" data-goto="facilities">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="พื้นที่ส่วนกลาง" data-en="Facilities"></div>
            <div class="desc" data-th="ค้นหาสิ่งอำนวยความสะดวก" data-en="Browse all common areas"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-gold" data-goto="news">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="ประกาศ/ข่าวสาร" data-en="Announcements"></div>
            <div class="desc" data-th="ข่าวสารล่าสุดจากนิติบุคคล" data-en="Latest news from the juristic office"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-teal" data-goto="facilities" data-zone-filter="__mybuilding">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="ส่วนกลางอาคารนี้" data-en="This Building's Amenities"></div>
            <div class="desc" data-th="เฉพาะอาคารที่คุณอยู่" data-en="Just for your building"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-indigo" data-goto="shuttle">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M3 11h18"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="ตาราง Shuttle Bus" data-en="Shuttle Bus"></div>
            <div class="desc" data-th="รอบรถรับส่งประจำวัน" data-en="Daily shuttle schedule"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-rose" data-goto="contact">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="ติดต่อนิติบุคคล" data-en="Contact Juristic Office"></div>
            <div class="desc" data-th="เบอร์โทร อีเมล เวลาทำการ" data-en="Phone, email, office hours"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
        <div class="quick-card grad-crimson wide" data-goto="emergency">
          <div class="qc-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg>
          </div>
          <div class="qc-text">
            <div class="label" data-th="ฉุกเฉิน" data-en="Emergency"></div>
            <div class="desc" data-th="เบอร์ด่วน จุดรวมพล" data-en="Hotlines & assembly point"></div>
          </div>
          <div class="qc-arrow">›</div>
        </div>
      </div>
      <div class="home-news">
        <div class="section-title" style="margin-bottom:10px;">
          <span data-th="ข่าวล่าสุด" data-en="Latest News"></span>
          <span class="see-all" data-goto="news" data-th="ดูทั้งหมด" data-en="See all"></span>
        </div>
        <div id="dashboard-news-list"></div>
      </div>
      <div class="project-footer">
        <div class="pf-tagline" data-th="ครบทุกไลฟ์สไตล์ในที่เดียว" data-en="Every lifestyle, one address"></div>
        <div class="pf-sub" data-th="พื้นที่ส่วนกลางครบครัน ออกแบบเพื่อชีวิตคนรุ่นใหม่" data-en="Full amenities, designed for modern living"></div>
        <div class="pf-stats">
          <div class="pf-stat"><div class="n" id="pf-stat-buildings">9</div><div class="l" data-th="อาคาร" data-en="Buildings"></div></div>
          <div class="pf-stat"><div class="n" id="pf-stat-zones">5</div><div class="l" data-th="โซน" data-en="Zones"></div></div>
          <div class="pf-stat"><div class="n">60+</div><div class="l" data-th="พื้นที่ส่วนกลาง" data-en="Facilities"></div></div>
        </div>
        <button class="pf-qr-btn" id="open-qr">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><line x1="14" y1="14" x2="14" y2="21"></line><line x1="21" y1="14" x2="21" y2="21"></line><line x1="14" y1="17.5" x2="21" y2="17.5"></line></svg>
          <span data-th="สแกนดูต่อบนมือถือ" data-en="Scan to view on your phone"></span>
        </button>
        <div class="pf-brand">KAVALON</div>
      </div>
    </div>
  </div>

  <div id="screen-map" class="screen">
    <div class="screen-pad">
      <div class="section-title" data-th="แผนที่โครงการ" data-en="Site Map"></div>
      <div class="section-sub" data-th="แตะหมุดเพื่อดูอาคารหรือโซนกิจกรรม" data-en="Tap a pin to explore a building or activity zone"></div>
    </div>
    <div class="calibrate-banner" id="calibrate-banner" style="display:none;">
      <div class="cb-text">
        <strong data-th="โหมดปรับตำแหน่งหมุด" data-en="Pin calibration mode"></strong>
        <span data-th="ลากหมุดแต่ละอันไปวางให้ตรงตึกจริง แล้วกด “คัดลอกตำแหน่ง” ส่งกลับมาให้ที่แชท" data-en="Drag each pin onto the real building, then tap “Copy positions” and paste the result back in chat"></span>
      </div>
      <div class="cb-actions">
        <button id="cb-copy" data-th="คัดลอกตำแหน่ง" data-en="Copy positions"></button>
        <button id="cb-exit" class="cb-exit" data-th="ออกจากโหมดนี้" data-en="Exit"></button>
      </div>
      <textarea id="cb-output" readonly></textarea>
    </div>
    <div class="map-toolbar">
      <div class="map-hint">↔️ <span data-th="ลากเพื่อเลื่อนดูแผนที่" data-en="Drag to scroll the map"></span></div>
      <div class="zoom-controls">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <span class="zoom-level" id="zoom-level">100%</span>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </div>
    <div class="map-scroll" id="map-scroll">
      <div class="map-wrap" id="map-wrap">
        <img src="assets/images/ground-map.jpg" alt="KAVALON site map" />
        <div id="map-pins"></div>
      </div>
    </div>
    <div class="map-legend">
      <div class="li"><span class="sw" style="background:#1fa15a"></span><span data-th="อาคารของคุณ" data-en="Your building"></span></div>
      <div class="li"><span class="sw" style="background:#173ab8"></span><span data-th="อาคารพักอาศัย" data-en="Residential building"></span></div>
      <div class="li"><span class="sw" style="background:#d7a94f"></span><span data-th="โซนกิจกรรม" data-en="Activity zone"></span></div>
    </div>
  </div>

  <div id="screen-facilities" class="screen">
    <div class="screen-pad" style="padding-bottom:0;">
      <div class="section-title" data-th="พื้นที่ส่วนกลาง" data-en="Common Facilities"></div>
      <div class="chip-row" id="facility-filter-chips"></div>
    </div>
    <div class="facility-grid" id="facility-grid"></div>
  </div>

  <div id="screen-facility-detail" class="screen">
    <div class="detail-back" data-goto="facilities">‹ <span data-th="ย้อนกลับ" data-en="Back"></span></div>
    <div class="gallery" id="facility-gallery">
      <button class="gallery-nav prev" id="fd-prev">‹</button>
      <button class="gallery-nav next" id="fd-next">›</button>
      <div class="gallery-dots" id="fd-dots"></div>
    </div>
    <div class="detail-body">
      <div class="detail-title" id="fd-title"></div>
      <div class="detail-tags" id="fd-tags"></div>
      <div class="detail-desc" id="fd-desc"></div>
      <div class="location-card" id="fd-location">
        <div class="location-text">
          <div class="location-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span data-th="ตำแหน่งที่ตั้ง" data-en="Location"></span>
          </div>
          <div class="location-desc" id="fd-location-desc"></div>
        </div>
        <button class="location-btn" id="fd-view-on-map" data-th="ดูบนแผนที่" data-en="View on map"></button>
      </div>
    </div>
  </div>

  <div id="screen-news" class="screen">
    <div class="screen-pad" style="padding-bottom:0;">
      <div class="section-title" data-th="ประกาศ/ข่าวสาร" data-en="Announcements &amp; News"></div>
    </div>
    <div class="announce-list" id="announce-list"></div>
  </div>

  <div id="screen-news-detail" class="screen">
    <div class="detail-back" data-goto="news">‹ <span data-th="ย้อนกลับ" data-en="Back"></span></div>
    <div class="detail-body">
      <div class="detail-tags" id="nd-tags"></div>
      <div class="detail-title" id="nd-title"></div>
      <div class="section-sub" id="nd-date" style="margin-top:8px;"></div>
      <div class="detail-desc" id="nd-body" style="margin-top:14px;"></div>
    </div>
  </div>

  <div id="screen-shuttle" class="screen">
    <div class="detail-back" data-goto="dashboard">‹ <span data-th="ย้อนกลับ" data-en="Back"></span></div>
    <div class="screen-pad" style="padding-top:8px;">
      <div class="section-title" data-th="ตาราง Shuttle Bus" data-en="Shuttle Bus Schedule"></div>
      <div class="section-sub" data-th="รอบรถรับส่งภายในโครงการและไปมหาวิทยาลัย" data-en="Shuttle times around the project and to the university"></div>
      <div class="placeholder-card">
        <div class="ph-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M3 11h18"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>
        </div>
        <div class="ph-title" data-th="ยังไม่มีตารางเวลาในระบบ" data-en="No schedule published yet"></div>
        <div class="ph-desc" data-th="นิติบุคคลจะนำรอบเวลารถรับส่งจริงมาแสดงที่นี่เร็วๆ นี้" data-en="The juristic office will publish the real shuttle times here soon."></div>
      </div>
    </div>
  </div>

  <div id="screen-contact" class="screen">
    <div class="detail-back" data-goto="dashboard">‹ <span data-th="ย้อนกลับ" data-en="Back"></span></div>
    <div class="screen-pad" style="padding-top:8px;">
      <div class="section-title" data-th="ติดต่อนิติบุคคล" data-en="Contact the Juristic Office"></div>
      <div class="contact-list">
        <div class="contact-row">
          <div class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
          <div class="c-text">
            <div class="c-label" data-th="โทรศัพท์" data-en="Phone"></div>
            <div class="c-value" data-th="รอข้อมูลจากนิติบุคคล" data-en="Pending from the juristic office"></div>
          </div>
        </div>
        <div class="contact-row">
          <div class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z" opacity="0"></path><path d="M22 6 12 13 2 6"></path><rect x="2" y="4" width="20" height="16" rx="2"></rect></svg></div>
          <div class="c-text">
            <div class="c-label" data-th="อีเมล" data-en="Email"></div>
            <div class="c-value" data-th="รอข้อมูลจากนิติบุคคล" data-en="Pending from the juristic office"></div>
          </div>
        </div>
        <div class="contact-row">
          <div class="c-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></div>
          <div class="c-text">
            <div class="c-label" data-th="เวลาทำการ" data-en="Office hours"></div>
            <div class="c-value" data-th="รอข้อมูลจากนิติบุคคล" data-en="Pending from the juristic office"></div>
          </div>
        </div>
      </div>
      <div class="settings-note" style="text-align:left; padding:0 4px;" data-th="* ข้อมูลติดต่อจะอัปเดตเมื่อนิติบุคคลให้รายละเอียดจริง" data-en="* Contact details will update once the juristic office provides them."></div>
    </div>
  </div>

  <div id="screen-emergency" class="screen">
    <div class="detail-back" data-goto="dashboard">‹ <span data-th="ย้อนกลับ" data-en="Back"></span></div>
    <div class="screen-pad" style="padding-top:8px;">
      <div class="section-title" data-th="ฉุกเฉิน" data-en="Emergency"></div>
      <div class="section-sub" data-th="เบอร์ด่วนระดับประเทศ ใช้ได้ทันทีทุกกรณีฉุกเฉิน" data-en="National hotlines — available for any emergency"></div>
      <div class="contact-list">
        <a class="contact-row" href="tel:191">
          <div class="c-icon emergency"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"></path></svg></div>
          <div class="c-text">
            <div class="c-label" data-th="ตำรวจ" data-en="Police"></div>
            <div class="c-value">191</div>
          </div>
        </a>
        <a class="contact-row" href="tel:199">
          <div class="c-icon emergency"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 17a2.5 2.5 0 0 0 2.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7.5 7.5 0 1 1-15 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></div>
          <div class="c-text">
